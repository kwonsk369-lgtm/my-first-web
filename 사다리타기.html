<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>알록달록 사다리타기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* 레이아웃: 상단 조작 막대 → 사다리 캔버스 카드 → 아래에 이름/결과 편집과 결과 목록 */
  :root {
    --bg: #F2F7FF;          /* 하늘빛 배경 */
    --surface: #FFFFFF;     /* 카드 바탕 */
    --fg: #22244D;          /* 본문 글자 */
    --muted: #686D9C;       /* 보조 글자 */
    --line: #DCE3F5;        /* 테두리 */
    --rung: #B9C2E0;        /* 사다리 가로줄 */
    --accent: #EE3F67;      /* 주 버튼(코랄 핑크) */
    --accent-ink: #FFFFFF;
    --sun: #FFC233;         /* 햇살 노랑 포인트 */
    --is-dark: 0;           /* 캔버스 색 계산용 */
    --font-display: 'Jua', 'Noto Sans KR', system-ui, sans-serif;
    --font-body: 'Noto Sans KR', system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141633; --surface: #1D2046; --fg: #EEF0FF; --muted: #A4A9D8;
      --line: #32376A; --rung: #4C5390; --accent: #FF6A8A; --accent-ink: #1A0B12;
      --sun: #FFD15C; --is-dark: 1; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141633; --surface: #1D2046; --fg: #EEF0FF; --muted: #A4A9D8;
    --line: #32376A; --rung: #4C5390; --accent: #FF6A8A; --accent-ink: #1A0B12;
    --sun: #FFD15C; --is-dark: 1; color-scheme: dark;
  }

  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  }
  .page {
    max-width: 1080px; margin: 0 auto;
    padding-block: 28px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; gap: 20px;
  }

  /* 머리말 */
  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
  h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 6vw, 44px); line-height: 1.1; margin: 0; text-wrap: balance; }
  h1 .dots { display: inline-flex; gap: 5px; margin-left: 10px; vertical-align: middle; }
  h1 .dots i { width: 11px; height: 11px; border-radius: 50%; display: block; }
  .lead { margin: 6px 0 0; color: var(--muted); }

  /* 조작 막대 */
  .controls {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    background: var(--surface); border: 2px solid var(--line); border-radius: 18px;
    padding: 12px 14px;
  }
  .count { display: flex; align-items: center; gap: 8px; }
  .count label { font-weight: 700; }
  .count input {
    width: 76px; font: inherit; font-weight: 700; font-variant-numeric: tabular-nums;
    padding: 8px 10px; border-radius: 12px; border: 2px solid var(--line);
    background: var(--bg); color: var(--fg); text-align: center;
  }
  .spacer { flex: 1 1 0; }
  button {
    font: inherit; font-weight: 700; cursor: pointer; border-radius: 12px;
    padding: 9px 14px; border: 2px solid var(--line); background: var(--surface); color: var(--fg);
    transition: transform .12s ease, background .12s ease;
  }
  button:hover { transform: translateY(-1px); }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.sun { background: var(--sun); border-color: var(--sun); color: #2B2100; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: default; transform: none; }

  /* 사다리 카드 */
  .board { background: var(--surface); border: 2px solid var(--line); border-radius: 22px; padding: 14px 10px 10px; }
  .board-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; padding: 0 8px 8px; }
  .hint { color: var(--muted); font-size: 14px; margin: 0; }
  .canvas-wrap { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; }
  canvas { display: block; touch-action: pan-x; }

  /* 하단: 편집기와 결과 */
  .lower { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
  @media (max-width: 860px) { .lower { grid-template-columns: 1fr 1fr; } .summary { grid-column: 1 / -1; } }
  @media (max-width: 560px) { .lower { grid-template-columns: 1fr; } }
  .panel { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 16px; min-width: 0; }
  .panel h2 { font-family: var(--font-display); font-weight: 400; font-size: 21px; margin: 0 0 4px; }
  .panel .sub { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  .list { display: grid; gap: 7px; max-height: 420px; overflow-y: auto; padding-right: 4px; }
  .row { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 8px; }
  .row.no-btn { grid-template-columns: 26px 1fr; }
  .num {
    width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .row input {
    min-width: 0; width: 100%; font: inherit; padding: 7px 10px; border-radius: 10px;
    border: 2px solid var(--line); background: var(--bg); color: var(--fg);
  }
  .row button { padding: 6px 10px; font-size: 13px; }

  .summary ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .summary li {
    display: grid; grid-template-columns: 12px minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 12px; background: var(--bg);
    animation: pop .35s ease-out;
  }
  .summary li .chip { width: 12px; height: 12px; border-radius: 50%; }
  .summary li .who { font-weight: 700; overflow-wrap: anywhere; }
  .summary li .arrow { color: var(--muted); }
  .summary li .what { font-family: var(--font-display); font-size: 17px; overflow-wrap: anywhere; }
  .empty { color: var(--muted); margin: 0; }
  @keyframes pop { from { transform: scale(.96); } to { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .summary li { animation: none; } button { transition: none; } }
</style>

<div class="page">
  <header>
    <div>
      <h1>사다리타기<span class="dots" aria-hidden="true"><i style="background:#FF5C7A"></i><i style="background:#FFC233"></i><i style="background:#3CCB7F"></i><i style="background:#3D9BFF"></i><i style="background:#A66BFF"></i></span></h1>
      <p class="lead">인원수를 정하고, 위쪽 이름을 누르면 사다리를 타고 내려가요.</p>
    </div>
  </header>

  <!-- 조작 막대 -->
  <section class="controls" aria-label="사다리 설정">
    <div class="count">
      <label for="countInput">인원수</label>
      <input id="countInput" type="number" min="2" max="30" value="12" inputmode="numeric">
      <span>명</span>
    </div>
    <button id="buildBtn" class="primary">사다리 만들기</button>
    <span class="spacer"></span>
    <button id="toggleBtn">가로줄 보이기</button>
    <button id="shuffleBtn">가로줄 다시 섞기</button>
    <button id="resetBtn">결과 지우기</button>
    <button id="allBtn" class="sun">모두 공개</button>
  </section>

  <!-- 사다리 캔버스 -->
  <section class="board" aria-label="사다리">
    <div class="board-head">
      <p class="hint" id="hint">가로줄은 숨겨져 있어요. 이름을 누르면 길이 드러나요.</p>
      <p class="hint" id="progress"></p>
    </div>
    <div class="canvas-wrap" id="wrap">
      <canvas id="ladder" role="img" aria-label="사다리타기 판. 위쪽 이름을 누르면 출발합니다."></canvas>
    </div>
  </section>

  <!-- 편집기와 결과 목록 -->
  <section class="lower">
    <div class="panel">
      <h2>참가자</h2>
      <p class="sub">사다리 위쪽에 놓이는 이름이에요.</p>
      <div class="list" id="nameList"></div>
    </div>
    <div class="panel">
      <h2>도착 항목</h2>
      <p class="sub">사다리 아래쪽에 놓이는 결과예요.</p>
      <div class="list" id="resultList"></div>
    </div>
    <div class="panel summary">
      <h2>결과</h2>
      <p class="sub" id="summarySub">0명 도착</p>
      <ol id="summaryList"></ol>
      <p class="empty" id="summaryEmpty">아직 아무도 내려오지 않았어요.</p>
    </div>
  </section>
</div>

<script>
// ───────────────────────── 기본 데이터 ─────────────────────────
// 처음 열었을 때 들어 있는 예시 이름 12명
const EXAMPLE_NAMES = ['김민준', '이서연', '박도윤', '최하은', '정시우', '강지아',
                       '조예준', '윤수아', '장주원', '임하린', '한지호', '오채원'];
// 예시 도착 항목 (인원수가 더 많으면 반복해서 채움)
const EXAMPLE_RESULTS = ['커피 쏘기', '꽝', '점심 메뉴 결정권', '꽝', '간식 사기', '꽝',
                         '청소 당번', '꽝', '오늘의 주인공', '꽝', '발표하기', '꽝'];

const MIN_COL = 66;        // 한 칸의 최소 너비(px). 좁은 화면에서는 가로 스크롤
const ROWS = 12;           // 가로줄이 놓일 수 있는 층 수
const PILL_H = 38;         // 이름·결과 상자 높이
const EDGE = 12;           // 캔버스 위아래 여백

// 앱 상태
const state = {
  n: 12,
  names: [],
  results: [],
  rungs: [],               // rungs[층][칸 사이] = { jit } 또는 null
  hidden: true,            // 가로줄 숨김 여부
  traces: new Map(),       // 출발 칸 → 진행 중이거나 끝난 경로
  order: []                // 도착한 순서(출발 칸 번호)
};

// ───────────────────────── 요소 참조 ─────────────────────────
const $ = id => document.getElementById(id);
const canvas = $('ladder');
const ctx = canvas.getContext('2d');
const wrap = $('wrap');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// 캔버스 크기 정보
let W = 0, H = 0;

// ───────────────────────── 색 계산 ─────────────────────────
// 칸마다 색상환을 고르게 나눠 서로 다른 색을 줌
function hueOf(i) { return (i * 360 / state.n + 350) % 360; }
function isDark() {
  return getComputedStyle(document.documentElement).getPropertyValue('--is-dark').trim() === '1';
}
function token(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
function colorsFor(i) {
  const h = hueOf(i);
  const dark = isDark();
  return {
    line:  dark ? `hsl(${h} 85% 62%)` : `hsl(${h} 82% 52%)`,        // 경로 선
    rail:  dark ? `hsl(${h} 70% 55% / .45)` : `hsl(${h} 80% 60% / .42)`, // 세로줄
    tint:  dark ? `hsl(${h} 45% 24%)` : `hsl(${h} 95% 93%)`,        // 상자 바탕
    ink:   dark ? `hsl(${h} 90% 82%)` : `hsl(${h} 75% 28%)`,        // 상자 글자
    solidInk: `hsl(${h} 80% 15%)`                                    // 진한 바탕 위 글자
  };
}

// ───────────────────────── 사다리 생성 ─────────────────────────
function buildLadder() {
  const n = state.n;
  const rungs = [];
  for (let r = 0; r < ROWS; r++) {
    const row = new Array(n - 1).fill(null);
    for (let j = 0; j < n - 1; j++) {
      // 같은 층에서 이웃한 가로줄이 붙지 않도록 왼쪽이 비어 있을 때만 놓음
      if (j > 0 && row[j - 1]) continue;
      if (Math.random() < 0.42) row[j] = { jit: (Math.random() - 0.5) * 0.5 };
    }
    rungs.push(row);
  }
  // 모든 칸 사이에 가로줄이 최소 하나는 있도록 보정
  for (let j = 0; j < n - 1; j++) {
    if (rungs.some(row => row[j])) continue;
    const free = [];
    for (let r = 0; r < ROWS; r++) {
      const left = j > 0 && rungs[r][j - 1];
      const right = j < n - 2 && rungs[r][j + 1];
      if (!left && !right) free.push(r);
    }
    const r = free.length ? free[Math.floor(Math.random() * free.length)] : Math.floor(Math.random() * ROWS);
    if (j > 0) rungs[r][j - 1] = null;
    if (j < n - 2) rungs[r][j + 1] = null;
    rungs[r][j] = { jit: (Math.random() - 0.5) * 0.5 };
  }
  state.rungs = rungs;
}

// 층 번호 → 세로 위치 비율(0=맨 위, 1=맨 아래)
function rowT(r, jit) { return (r + 1 + jit) / (ROWS + 1); }

// 출발 칸에서 도착 칸까지의 경로 꼭짓점 계산
function computePath(start) {
  let c = start;
  const nodes = [{ c, t: 0 }];
  for (let r = 0; r < ROWS; r++) {
    const row = state.rungs[r];
    if (c < state.n - 1 && row[c]) {
      const t = rowT(r, row[c].jit);
      nodes.push({ c, t }, { c: c + 1, t });
      c += 1;
    } else if (c > 0 && row[c - 1]) {
      const t = rowT(r, row[c - 1].jit);
      nodes.push({ c, t }, { c: c - 1, t });
      c -= 1;
    }
  }
  nodes.push({ c, t: 1 });
  return { nodes, end: c };
}

// ───────────────────────── 좌표 변환 ─────────────────────────
function colW() { return W / state.n; }
function xOf(c) { return colW() * (c + 0.5); }
function railTop() { return EDGE + PILL_H; }
function railBottom() { return H - EDGE - PILL_H; }
function yOf(t) { return railTop() + (railBottom() - railTop()) * t; }

// ───────────────────────── 캔버스 크기 ─────────────────────────
function resizeCanvas() {
  const avail = wrap.clientWidth;
  W = Math.max(avail, state.n * MIN_COL);
  H = avail < 600 ? 440 : 500;
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw(performance.now());
}

// ───────────────────────── 그리기 도우미 ─────────────────────────
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
// 칸 너비에 맞게 글자를 줄임
function fitText(text, maxW) {
  if (ctx.measureText(text).width <= maxW) return text;
  let s = text;
  while (s.length > 1 && ctx.measureText(s + '…').width > maxW) s = s.slice(0, -1);
  return s + '…';
}
// 감속 곡선: 처음엔 빠르고 끝으로 갈수록 부드럽게 느려짐
function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }

// 경로를 진행률(p)만큼 그리고 끝점 좌표를 돌려줌
function drawPartialPath(nodes, p, color) {
  const pts = nodes.map(nd => ({ x: xOf(nd.c), y: yOf(nd.t) }));
  // 위아래 상자까지 선을 이어 줌
  pts[0] = { x: pts[0].x, y: railTop() };
  const lens = [];
  let total = 0;
  for (let i = 1; i < pts.length; i++) {
    const l = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    lens.push(l); total += l;
  }
  let remain = total * p;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  let head = { ...pts[0] };
  for (let i = 1; i < pts.length; i++) {
    const l = lens[i - 1];
    if (remain >= l) {
      ctx.lineTo(pts[i].x, pts[i].y);
      head = { ...pts[i] };
      remain -= l;
    } else {
      const k = l === 0 ? 0 : remain / l;
      head = { x: pts[i - 1].x + (pts[i].x - pts[i - 1].x) * k, y: pts[i - 1].y + (pts[i].y - pts[i - 1].y) * k };
      ctx.lineTo(head.x, head.y);
      break;
    }
  }
  ctx.strokeStyle = color;
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();
  return head;
}

// ───────────────────────── 전체 그리기 ─────────────────────────
function draw(now) {
  ctx.clearRect(0, 0, W, H);
  const n = state.n;
  const cw = colW();
  const surface = token('--surface');

  // 1) 세로줄: 칸마다 다른 색
  ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    ctx.beginPath();
    ctx.moveTo(xOf(i), railTop());
    ctx.lineTo(xOf(i), railBottom());
    ctx.strokeStyle = colorsFor(i).rail;
    ctx.lineWidth = 4;
    ctx.stroke();
  }

  // 2) 가로줄 (숨김 상태면 물음표만 표시)
  if (!state.hidden) {
    ctx.strokeStyle = token('--rung');
    ctx.lineWidth = 4;
    for (let r = 0; r < ROWS; r++) {
      state.rungs[r].forEach((rung, j) => {
        if (!rung) return;
        const y = yOf(rowT(r, rung.jit));
        ctx.beginPath();
        ctx.moveTo(xOf(j), y);
        ctx.lineTo(xOf(j + 1), y);
        ctx.stroke();
      });
    }
  } else {
    ctx.fillStyle = token('--rung');
    ctx.font = `22px ${token('--font-display')}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let j = 0; j < n - 1; j++) {
      ctx.fillText('?', (xOf(j) + xOf(j + 1)) / 2, yOf(j % 2 ? 0.38 : 0.62));
    }
  }

  // 3) 이동 경로
  let animating = false;
  const heads = [];
  state.traces.forEach(tr => {
    const raw = Math.min(1, (now - tr.start) / tr.dur);
    const p = easeOutQuart(raw);
    const col = colorsFor(tr.col);
    const head = drawPartialPath(tr.nodes, p, col.line);
    if (raw < 1) {
      animating = true;
      heads.push({ head, color: col.line });
    } else if (!tr.done) {
      tr.done = true;
      tr.doneAt = now;
      state.order.push(tr.col);
      updateSummary();
    }
    if (tr.done && now - tr.doneAt < 600) animating = true;
  });
  // 움직이는 머리 점은 선 위에 그림
  heads.forEach(({ head, color }) => {
    ctx.beginPath();
    ctx.arc(head.x, head.y, 9, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = surface;
    ctx.stroke();
  });

  // 4) 위쪽 이름 상자
  const boxW = Math.min(cw - 8, 96);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < n; i++) {
    const c = colorsFor(i);
    const x = xOf(i) - boxW / 2;
    const started = state.traces.has(i);
    roundRect(x, EDGE, boxW, PILL_H, PILL_H / 2);
    ctx.fillStyle = started ? c.line : c.tint;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = c.line;
    ctx.stroke();
    ctx.fillStyle = started ? c.solidInk : c.ink;
    ctx.font = `16px ${token('--font-display')}`;
    ctx.fillText(fitText(state.names[i] || `참가자 ${i + 1}`, boxW - 12), xOf(i), EDGE + PILL_H / 2 + 1);
  }

  // 5) 아래쪽 도착 상자: 도착한 사람의 색으로 칠함
  const arrived = new Map();
  state.traces.forEach(tr => { if (tr.done) arrived.set(tr.end, tr); });
  for (let i = 0; i < n; i++) {
    const tr = arrived.get(i);
    let scale = 1;
    if (tr) {
      const age = now - tr.doneAt;
      if (age < 600) scale = 1 + 0.14 * Math.sin(Math.PI * age / 600); // 도착 순간 통통 튀는 효과
    }
    const w = boxW * scale, h = PILL_H * scale;
    const cx = xOf(i), cy = H - EDGE - PILL_H / 2;
    roundRect(cx - w / 2, cy - h / 2, w, h, 10);
    if (tr) {
      const c = colorsFor(tr.col);
      ctx.fillStyle = c.line; ctx.fill();
      ctx.fillStyle = c.solidInk;
    } else {
      ctx.fillStyle = surface; ctx.fill();
      ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
      ctx.strokeStyle = token('--rung'); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = token('--muted');
    }
    ctx.font = `15px ${token('--font-display')}`;
    ctx.fillText(fitText(state.results[i] || '꽝', w - 12), cx, cy + 1);
  }

  if (animating) requestAnimationFrame(draw);
}

// ───────────────────────── 출발과 공개 ─────────────────────────
function startTrace(col, dur) {
  if (state.traces.has(col)) return; // 이미 출발한 사람은 다시 타지 않음
  const { nodes, end } = computePath(col);
  state.traces.set(col, {
    col, nodes, end,
    start: performance.now(),
    dur: reduceMotion ? 300 : dur,
    done: false
  });
  updateButtons();
  requestAnimationFrame(draw);
}
function revealAll() {
  for (let i = 0; i < state.n; i++) startTrace(i, 3400);
}
function clearResults() {
  state.traces.clear();
  state.order = [];
  updateSummary();
  updateButtons();
  draw(performance.now());
}

// ───────────────────────── 인원수 변경 ─────────────────────────
function setCount(v) {
  let n = parseInt(v, 10);
  if (isNaN(n)) n = state.n;
  n = Math.max(2, Math.min(30, n));
  $('countInput').value = n;
  // 기존에 입력한 이름과 결과는 유지하고, 부족한 칸만 채움
  for (let i = state.names.length; i < n; i++) {
    state.names.push(EXAMPLE_NAMES[i] || `참가자 ${i + 1}`);
  }
  for (let i = state.results.length; i < n; i++) {
    state.results.push(EXAMPLE_RESULTS[i % EXAMPLE_RESULTS.length]);
  }
  state.names.length = n;
  state.results.length = n;
  state.n = n;
  buildLadder();
  state.traces.clear();
  state.order = [];
  renderEditors();
  updateSummary();
  updateButtons();
  resizeCanvas();
}

// ───────────────────────── 편집 목록 ─────────────────────────
function numBadge(i) {
  const c = colorsFor(i);
  const el = document.createElement('span');
  el.className = 'num';
  el.textContent = i + 1;
  el.style.background = c.tint;
  el.style.color = c.ink;
  el.style.boxShadow = `inset 0 0 0 2px ${c.line}`;
  return el;
}
function renderEditors() {
  const nameList = $('nameList');
  const resultList = $('resultList');
  nameList.innerHTML = '';
  resultList.innerHTML = '';
  for (let i = 0; i < state.n; i++) {
    // 참가자 줄: 번호, 이름 입력, 출발 버튼
    const row = document.createElement('div');
    row.className = 'row';
    const input = document.createElement('input');
    input.id = `name-${i}`;
    input.value = state.names[i];
    input.maxLength = 12;
    input.setAttribute('aria-label', `${i + 1}번 참가자 이름`);
    input.addEventListener('input', () => {
      state.names[i] = input.value.trim();
      draw(performance.now());
      updateSummary();
    });
    const btn = document.createElement('button');
    btn.textContent = '출발';
    btn.dataset.col = i;
    btn.addEventListener('click', () => startTrace(i, 2600));
    row.append(numBadge(i), input, btn);
    nameList.append(row);

    // 결과 줄: 번호, 결과 입력
    const rrow = document.createElement('div');
    rrow.className = 'row no-btn';
    const rin = document.createElement('input');
    rin.id = `result-${i}`;
    rin.value = state.results[i];
    rin.maxLength = 14;
    rin.setAttribute('aria-label', `${i + 1}번 도착 항목`);
    rin.addEventListener('input', () => {
      state.results[i] = rin.value.trim();
      draw(performance.now());
      updateSummary();
    });
    rrow.append(numBadge(i), rin);
    resultList.append(rrow);
  }
}
// 편집 목록의 번호 색을 테마에 맞게 다시 칠함
function recolorBadges() {
  document.querySelectorAll('.list').forEach(list => {
    list.querySelectorAll('.num').forEach((el, i) => {
      const c = colorsFor(i);
      el.style.background = c.tint;
      el.style.color = c.ink;
      el.style.boxShadow = `inset 0 0 0 2px ${c.line}`;
    });
  });
}

// ───────────────────────── 결과 목록과 버튼 상태 ─────────────────────────
function updateSummary() {
  const list = $('summaryList');
  list.innerHTML = '';
  state.order.forEach(col => {
    const tr = state.traces.get(col);
    if (!tr) return;
    const li = document.createElement('li');
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.style.background = colorsFor(col).line;
    const who = document.createElement('span');
    who.className = 'who';
    who.textContent = state.names[col] || `참가자 ${col + 1}`;
    const arrow = document.createElement('span');
    arrow.className = 'arrow';
    arrow.textContent = '→';
    const what = document.createElement('span');
    what.className = 'what';
    what.textContent = state.results[tr.end] || '꽝';
    li.append(chip, who, arrow, what);
    list.append(li);
  });
  const count = state.order.length;
  $('summaryEmpty').hidden = count > 0;
  $('summarySub').textContent = count === state.n ? `${state.n}명 모두 도착했어요` : `${count}명 도착 / 전체 ${state.n}명`;
  $('progress').textContent = count ? `${count} / ${state.n}명 도착` : '';
}
function updateButtons() {
  document.querySelectorAll('#nameList button').forEach(b => {
    b.disabled = state.traces.has(Number(b.dataset.col));
  });
  $('allBtn').disabled = state.traces.size === state.n;
}

// ───────────────────────── 이벤트 연결 ─────────────────────────
$('buildBtn').addEventListener('click', () => setCount($('countInput').value));
$('countInput').addEventListener('keydown', e => { if (e.key === 'Enter') setCount(e.target.value); });
$('shuffleBtn').addEventListener('click', () => { buildLadder(); clearResults(); });
$('resetBtn').addEventListener('click', clearResults);
$('allBtn').addEventListener('click', revealAll);
$('toggleBtn').addEventListener('click', () => {
  state.hidden = !state.hidden;
  $('toggleBtn').textContent = state.hidden ? '가로줄 보이기' : '가로줄 숨기기';
  $('hint').textContent = state.hidden
    ? '가로줄은 숨겨져 있어요. 이름을 누르면 길이 드러나요.'
    : '가로줄이 모두 보여요. 이름을 누르면 출발해요.';
  draw(performance.now());
});

// 캔버스 위쪽 이름 상자를 누르면 출발
function colAt(e) {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  if (y > EDGE + PILL_H + 6) return -1;
  const c = Math.floor(x / colW());
  return c >= 0 && c < state.n ? c : -1;
}
canvas.addEventListener('click', e => {
  const c = colAt(e);
  if (c >= 0) startTrace(c, 2600);
});
canvas.addEventListener('mousemove', e => {
  const c = colAt(e);
  canvas.style.cursor = c >= 0 && !state.traces.has(c) ? 'pointer' : 'default';
});

// 창 크기와 테마 변화에 맞춰 다시 그림
new ResizeObserver(() => resizeCanvas()).observe(wrap);
const themeRefresh = () => { recolorBadges(); updateSummary(); draw(performance.now()); };
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeRefresh);
new MutationObserver(themeRefresh).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// 글꼴이 늦게 도착하면 캔버스 글자를 다시 그림
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => draw(performance.now()));

// ───────────────────────── 시작 ─────────────────────────
setCount(12);
</script>

</body></html>
