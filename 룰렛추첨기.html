<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교육장 룰렛 추첨기</title>
<!-- 제목용 둥근 글꼴 (인터넷이 없으면 기본 글꼴로 표시됩니다) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  /* ===== 기본 색상과 글꼴 ===== */
  :root{
    --bg1:#fff4df; --bg2:#e6f5ff;
    --ink:#2b2d42; --muted:#6c7086;
    --card:#ffffff; --line:#efe7d8;
    --primary:#ff5d73; --primary-dk:#e8435a;
    --blue:#3fa7f5; --green:#20c39a; --yellow:#ffc93c; --purple:#8e7cf0;
    --radius:22px;
    --shadow:0 10px 30px rgba(43,45,66,.10);
    --title-font:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  }
  html{font-size:18px}
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; color:var(--ink);
    font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    background-attachment:fixed;
  }
  button{font-family:inherit; cursor:pointer}
  button:disabled{cursor:not-allowed; opacity:.5}

  /* ===== 상단 바 ===== */
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 24px; flex-wrap:wrap;
  }
  .topbar h1{font-family:var(--title-font); font-weight:400; font-size:2rem; margin:0; letter-spacing:.5px}
  .topbar h1 span{color:var(--primary)}
  .top-actions{display:flex; gap:8px; flex-wrap:wrap}
  .chip-btn{
    border:2px solid var(--line); background:#fff; color:var(--ink);
    border-radius:999px; padding:.45rem 1rem; font-size:.9rem; font-weight:700;
    box-shadow:0 3px 0 var(--line); transition:transform .1s;
  }
  .chip-btn:hover{transform:translateY(-1px)}
  .chip-btn:active{transform:translateY(2px); box-shadow:none}

  /* ===== 전체 배치 ===== */
  .layout{
    display:grid; grid-template-columns:minmax(260px,330px) 1fr; gap:20px;
    padding:0 24px 24px;
  }
  .layout.hide-list{grid-template-columns:1fr}
  .layout.hide-list .list-panel{display:none}
  .panel{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px}

  /* ===== 명단 패널 ===== */
  .list-panel{display:flex; flex-direction:column; gap:12px}
  .panel-title{font-family:var(--title-font); font-weight:400; font-size:1.4rem; margin:0; display:flex; justify-content:space-between; align-items:center}
  .count-badge{font-family:inherit; font-size:.85rem; font-weight:800; background:var(--yellow); border-radius:999px; padding:.2rem .7rem}
  .hint{font-size:.8rem; color:var(--muted); margin:0; line-height:1.5}
  #nameInput{
    width:100%; flex:1; min-height:280px; resize:vertical;
    border:2px dashed #e2d6bf; border-radius:16px; padding:14px;
    font-size:1.05rem; line-height:1.6; font-family:inherit; color:var(--ink); background:#fffdf8;
  }
  #nameInput:focus{outline:none; border-color:var(--blue); border-style:solid}
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}

  /* ===== 탭 ===== */
  .stage{display:flex; flex-direction:column; gap:16px; min-width:0}
  .tabs{display:flex; gap:10px}
  .tab{
    flex:1; border:none; border-radius:16px; padding:.8rem 1rem;
    font-family:var(--title-font); font-size:1.35rem; background:#f4f1ea; color:var(--muted);
  }
  .tab.active{background:var(--primary); color:#fff; box-shadow:0 5px 0 var(--primary-dk)}
  .view{display:none}
  .view.active{display:block}

  /* ===== 발표자 뽑기 화면 ===== */
  .pick-grid{display:flex; gap:20px; align-items:flex-start}
  .wheel-wrap{flex:1; display:flex; justify-content:center; min-width:0}
  #wheel{display:block; cursor:pointer; touch-action:manipulation}
  .pick-side{width:290px; display:flex; flex-direction:column; gap:14px}
  .big-btn{
    border:none; border-radius:20px; padding:1.1rem 1rem; width:100%;
    font-family:var(--title-font); font-size:1.8rem; color:#fff;
    background:linear-gradient(135deg,#ff7a59,var(--primary));
    box-shadow:0 7px 0 var(--primary-dk); transition:transform .1s;
  }
  .big-btn:hover:not(:disabled){transform:translateY(-2px)}
  .big-btn:active:not(:disabled){transform:translateY(5px); box-shadow:0 2px 0 var(--primary-dk)}
  .check{display:flex; align-items:center; gap:10px; font-size:1.05rem; font-weight:700; cursor:pointer; user-select:none}
  .check input{width:1.4rem; height:1.4rem; accent-color:var(--primary)}
  .status{font-size:.95rem; color:var(--muted); min-height:1.4em; margin:0}
  .history{background:#fbf8f2; border-radius:16px; padding:14px}
  .history h3{margin:0 0 10px; font-family:var(--title-font); font-weight:400; font-size:1.2rem; display:flex; justify-content:space-between; align-items:center}
  .history ol{margin:0; padding:0; list-style:none; display:flex; flex-wrap:wrap; gap:6px; max-height:40vh; overflow:auto}
  .history li{background:#fff; border:2px solid var(--line); border-radius:999px; padding:.25rem .7rem; font-weight:700; font-size:.95rem}
  .history li b{color:var(--primary); margin-right:4px}
  .history .empty{color:var(--muted); font-size:.9rem}
  .link-btn{border:none; background:none; color:var(--blue); font-weight:800; font-size:.85rem; padding:0}

  /* ===== 조 편성 화면 ===== */
  .team-controls{display:flex; gap:14px; flex-wrap:wrap; align-items:center; background:#fbf8f2; border-radius:18px; padding:14px 16px}
  .seg{display:flex; background:#fff; border-radius:14px; padding:4px; border:2px solid var(--line)}
  .seg label{cursor:pointer}
  .seg input{display:none}
  .seg span{display:block; padding:.5rem 1rem; border-radius:10px; font-weight:800; font-size:1rem; color:var(--muted)}
  .seg input:checked + span{background:var(--blue); color:#fff}
  .stepper{display:flex; align-items:center; gap:6px; font-weight:800; font-size:1.1rem}
  .stepper button{width:2.4rem; height:2.4rem; border-radius:12px; border:2px solid var(--line); background:#fff; font-size:1.3rem; font-weight:800}
  .stepper input{width:4rem; height:2.4rem; text-align:center; font-size:1.3rem; font-weight:800; border:2px solid var(--line); border-radius:12px; font-family:inherit}
  .action-btn{border:none; border-radius:14px; padding:.65rem 1.2rem; font-size:1.05rem; font-weight:800; color:#fff; box-shadow:0 4px 0 rgba(0,0,0,.15)}
  .action-btn:active:not(:disabled){transform:translateY(3px); box-shadow:none}
  .btn-green{background:var(--green)}
  .btn-purple{background:var(--purple)}
  .btn-blue{background:var(--blue)}
  .team-summary{font-size:1.05rem; font-weight:800; color:var(--muted); margin:16px 0 10px}
  .team-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px}
  .team-card{background:#fff; border-radius:20px; overflow:hidden; border:3px solid var(--c); animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
  .team-card header{background:var(--c); color:#fff; padding:.6rem 1rem; display:flex; justify-content:space-between; align-items:center}
  .team-card header strong{font-family:var(--title-font); font-weight:400; font-size:1.7rem; text-shadow:0 2px 0 rgba(0,0,0,.12)}
  .team-card header span{font-weight:800; font-size:.95rem; background:rgba(255,255,255,.3); border-radius:999px; padding:.15rem .6rem}
  .team-card ul{list-style:none; margin:0; padding:.6rem 1rem 1rem}
  .team-card li{font-size:1.35rem; font-weight:800; padding:.35rem 0; border-bottom:2px dotted #eee}
  .team-card li:last-child{border-bottom:none}
  .team-empty{text-align:center; color:var(--muted); padding:60px 20px; font-size:1.1rem; line-height:1.8}
  .team-empty .emoji{font-size:3.5rem}
  @keyframes pop{from{opacity:0; transform:scale(.7) translateY(20px)} to{opacity:1; transform:none}}

  /* ===== 당첨자 발표 창 ===== */
  .winner-overlay{
    position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center;
    background:rgba(43,45,66,.45); backdrop-filter:blur(4px); padding:20px;
  }
  .winner-overlay.show{display:flex}
  .winner-card{
    background:#fff; border-radius:32px; padding:40px 56px; text-align:center; max-width:92vw;
    box-shadow:0 30px 80px rgba(0,0,0,.25); animation:winnerIn .6s cubic-bezier(.2,1.5,.4,1) both;
  }
  .winner-label{font-family:var(--title-font); font-size:1.8rem; color:var(--muted)}
  .winner-name{
    font-family:var(--title-font); font-weight:400; line-height:1.15; margin:14px 0 24px;
    font-size:clamp(4rem,12vw,10rem); word-break:keep-all;
    background:linear-gradient(135deg,#ff7a59,var(--primary),var(--purple));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:bounce 1.2s ease-in-out .6s infinite;
  }
  .winner-actions{display:flex; gap:12px; justify-content:center; flex-wrap:wrap}
  @keyframes winnerIn{from{opacity:0; transform:scale(.4) rotate(-6deg)} to{opacity:1; transform:none}}
  @keyframes bounce{0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)}}

  /* ===== 꽃가루 / 알림 ===== */
  #confetti{position:fixed; inset:0; pointer-events:none; z-index:60}
  .toast{
    position:fixed; left:50%; bottom:30px; transform:translate(-50%,30px); z-index:70;
    background:var(--ink); color:#fff; padding:.8rem 1.4rem; border-radius:999px; font-weight:800;
    opacity:0; transition:all .3s; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translate(-50%,0)}

  /* ===== 좁은 화면 대응 ===== */
  @media (max-width:900px){
    .topbar{padding:12px 16px}
    .layout{grid-template-columns:1fr; padding:0 16px 16px}
    .pick-grid{flex-direction:column; align-items:stretch}
    .pick-side{width:100%}
    #nameInput{min-height:180px}
  }
</style>
</head>
<body>

<!-- 상단 바 -->
<header class="topbar">
  <h1>🎡 룰렛 <span>추첨기</span></h1>
  <div class="top-actions">
    <button class="chip-btn" id="toggleListBtn">📋 명단 접기</button>
    <button class="chip-btn" id="fontDownBtn" title="글씨 작게">가-</button>
    <button class="chip-btn" id="fontUpBtn" title="글씨 크게">가+</button>
    <button class="chip-btn" id="fullscreenBtn">⛶ 전체 화면</button>
  </div>
</header>

<main class="layout" id="layout">
  <!-- 왼쪽: 명단 입력 -->
  <aside class="panel list-panel">
    <h2 class="panel-title">참가자 명단 <span class="count-badge" id="countBadge">0명</span></h2>
    <p class="hint">한 줄에 한 명씩 입력하세요.<br>엑셀에서 이름 칸을 복사해 붙여넣어도 됩니다.</p>
    <textarea id="nameInput" spellcheck="false" placeholder="예)&#10;김민준&#10;이서연&#10;박지호"></textarea>
    <div class="row">
      <button class="chip-btn" id="sampleBtn">예시 이름 넣기</button>
      <button class="chip-btn" id="clearBtn">모두 지우기</button>
    </div>
  </aside>

  <!-- 오른쪽: 기능 화면 -->
  <section class="panel stage">
    <div class="tabs">
      <button class="tab active" data-tab="pickView">🎯 발표자 뽑기</button>
      <button class="tab" data-tab="teamView">👥 조 편성</button>
    </div>

    <!-- 발표자 뽑기 -->
    <div class="view active" id="pickView">
      <div class="pick-grid">
        <div class="wheel-wrap" id="wheelWrap">
          <canvas id="wheel" aria-label="룰렛"></canvas>
        </div>
        <div class="pick-side">
          <button class="big-btn" id="spinBtn">🎯 발표자 뽑기</button>
          <label class="check"><input type="checkbox" id="excludeChk" checked> 이미 뽑힌 사람 제외</label>
          <label class="check"><input type="checkbox" id="soundChk" checked> 효과음 켜기</label>
          <p class="status" id="pickStatus"></p>
          <div class="history">
            <h3>뽑힌 사람 <button class="link-btn" id="resetHistoryBtn">기록 초기화</button></h3>
            <ol id="historyList"></ol>
          </div>
          <p class="hint">💡 룰렛을 클릭하거나 스페이스바를 눌러도 돌아갑니다.</p>
        </div>
      </div>
    </div>

    <!-- 조 편성 -->
    <div class="view" id="teamView">
      <div class="team-controls">
        <div class="seg">
          <label><input type="radio" name="teamMode" value="count" checked><span>N개 조로 나누기</span></label>
          <label><input type="radio" name="teamMode" value="size"><span>N명씩 나누기</span></label>
        </div>
        <div class="stepper">
          <button id="nMinus" aria-label="줄이기">−</button>
          <input type="number" id="teamN" value="3" min="1">
          <span id="teamUnit">개 조</span>
          <button id="nPlus" aria-label="늘리기">+</button>
        </div>
        <button class="action-btn btn-green" id="makeTeamBtn">조 편성하기</button>
        <button class="action-btn btn-purple" id="reshuffleBtn" disabled>🔀 다시 섞기</button>
        <button class="action-btn btn-blue" id="copyBtn" disabled>📋 복사</button>
      </div>
      <p class="team-summary" id="teamSummary"></p>
      <div class="team-grid" id="teamGrid"></div>
      <div class="team-empty" id="teamEmpty">
        <div class="emoji">👥</div>
        나눌 방법과 숫자를 고른 뒤<br><b>[조 편성하기]</b>를 눌러 주세요.
      </div>
    </div>
  </section>
</main>

<!-- 당첨자 발표 창 -->
<div class="winner-overlay" id="winnerOverlay">
  <div class="winner-card">
    <div class="winner-label">🎉 오늘의 발표자 🎉</div>
    <div class="winner-name" id="winnerName"></div>
    <div class="winner-actions">
      <button class="action-btn btn-blue" id="winnerOkBtn">확인</button>
      <button class="action-btn btn-green" id="winnerAgainBtn">🎯 한 명 더 뽑기</button>
    </div>
  </div>
</div>

<canvas id="confetti"></canvas>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   상수와 상태
   ========================================================= */
const TAU = Math.PI * 2;
const SAMPLE_NAMES = ['김민준','이서연','박지호','최수아','정도윤','강하은','조시우','윤지유','장예준','임서윤','한주원','오채원'];
// 룰렛 칸 색상 (이웃한 칸끼리 색이 확 달라 보이도록 순서를 섞어 둠)
const COLORS = ['#FF6B6B','#FFD43B','#4DABF7','#69DB7C','#B197FC','#FFA94D','#38D9A9','#F783AC','#748FFC','#A9E34B','#FF8787','#66D9E8'];
const STORAGE_KEY = 'roulette-names';
const FONT_KEY = 'roulette-font';

let names = [];        // 입력된 전체 명단
let drawn = [];        // 지금까지 뽑힌 사람 (순서대로)
let wheelNames = [];   // 현재 룰렛에 올라간 이름
let rotation = 0;      // 룰렛 회전 각도(라디안)
let spinning = false;  // 룰렛이 도는 중인지
let groups = null;     // 마지막 조 편성 결과
let wheelSize = 400;   // 룰렛 표시 크기(px)
let audioCtx = null;   // 효과음용 오디오
const dpr = Math.max(1, window.devicePixelRatio || 1);

/* ===== 자주 쓰는 요소 ===== */
const $ = (id) => document.getElementById(id);
const nameInput = $('nameInput');
const canvas = $('wheel');
const ctx = canvas.getContext('2d');
const titleFont = getComputedStyle(document.documentElement).getPropertyValue('--title-font').trim();

/* =========================================================
   유틸리티
   ========================================================= */
// 공정한 무작위 정수 (0 이상 n 미만)
function randInt(n){
  if (window.crypto && crypto.getRandomValues){
    const buf = new Uint32Array(1);
    crypto.getRandomValues(buf);
    return buf[0] % n;
  }
  return Math.floor(Math.random() * n);
}
// 피셔-예이츠 방식으로 배열 섞기
function shuffle(arr){
  for (let i = arr.length - 1; i > 0; i--){
    const j = randInt(i + 1);
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
// 안전하게 저장/불러오기 (사용할 수 없는 환경이면 무시)
function save(key, value){ try { localStorage.setItem(key, value); } catch(e){} }
function load(key){ try { return localStorage.getItem(key); } catch(e){ return null; } }

// 아래쪽에 잠깐 알림 띄우기
let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* =========================================================
   명단 처리
   ========================================================= */
// 줄바꿈·탭(엑셀 복사)으로 이름을 나누고 빈칸과 따옴표 정리
function parseNames(text){
  return text
    .split(/\r\n|\r|\n|\t/)
    .map(s => s.replace(/^["']+|["']+$/g, '').trim())
    .filter(Boolean);
}

function onNamesChanged(){
  names = parseNames(nameInput.value);
  $('countBadge').textContent = names.length + '명';
  save(STORAGE_KEY, nameInput.value);
  if (!spinning) refreshWheel();
}

// 뽑을 수 있는 사람 목록 (뽑힌 횟수만큼 한 명씩 빼서 동명이인도 처리)
function getCandidates(){
  const list = names.slice();
  for (const d of drawn){
    const idx = list.indexOf(d);
    if (idx !== -1) list.splice(idx, 1);
  }
  return list;
}

/* =========================================================
   룰렛 그리기
   ========================================================= */
// 칸 색 고르기: 마지막 칸이 첫 칸과 같은 색이 되지 않게 조정
function segColor(i, n){
  let idx = i % COLORS.length;
  if (n > 1 && i === n - 1 && idx === 0){
    const prev = (n - 2) % COLORS.length;
    idx = [1,2,3].find(k => k !== prev);
  }
  return COLORS[idx];
}
// 배경색이 밝으면 진한 글씨, 어두우면 흰 글씨
function textColorFor(hex){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return (r*0.299 + g*0.587 + b*0.114) > 170 ? '#2b2d42' : '#ffffff';
}
// 칸에 들어가지 않는 긴 이름은 말줄임표로 줄이기
function fitText(text, maxW){
  if (ctx.measureText(text).width <= maxW) return text;
  let t = text;
  while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return t + '…';
}

function drawWheel(){
  const s = wheelSize, c = s / 2, r = c - 14;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, s, s);

  // 바깥 흰 테두리 + 그림자
  ctx.save();
  ctx.beginPath(); ctx.arc(c, c, r + 8, 0, TAU);
  ctx.fillStyle = '#fff';
  ctx.shadowColor = 'rgba(0,0,0,.18)'; ctx.shadowBlur = 26; ctx.shadowOffsetY = 8;
  ctx.fill();
  ctx.restore();

  const n = wheelNames.length;
  if (n === 0){
    // 이름이 없을 때 안내
    ctx.beginPath(); ctx.arc(c, c, r, 0, TAU);
    ctx.fillStyle = '#f1f3f5'; ctx.fill();
    ctx.fillStyle = '#868e96';
    ctx.font = `${Math.max(16, s * 0.05)}px ${titleFont}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(names.length ? '모두 뽑혔어요!' : '명단을 입력해 주세요', c, c - s * 0.22);
  } else {
    const seg = TAU / n;
    // 칸 채우기
    for (let i = 0; i < n; i++){
      const start = rotation + i * seg;
      ctx.beginPath();
      ctx.moveTo(c, c);
      ctx.arc(c, c, r, start, start + seg);
      ctx.closePath();
      ctx.fillStyle = segColor(i, n);
      ctx.fill();
      if (n > 1){ ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2; ctx.stroke(); }
    }
    // 이름 쓰기 (칸 수에 따라 글씨 크기 자동 조절)
    const fontPx = Math.max(11, Math.min(r * 0.13, seg * r * 0.45, 48));
    ctx.font = `${fontPx}px ${titleFont}`;
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for (let i = 0; i < n; i++){
      ctx.save();
      ctx.translate(c, c);
      ctx.rotate(rotation + (i + 0.5) * seg);
      ctx.fillStyle = textColorFor(segColor(i, n));
      ctx.fillText(fitText(wheelNames[i], r * 0.66), r - fontPx * 0.5, 0);
      ctx.restore();
    }
  }

  // 가운데 원 (클릭하면 돌아감)
  const hub = r * 0.17;
  ctx.save();
  ctx.beginPath(); ctx.arc(c, c, hub, 0, TAU);
  ctx.fillStyle = '#fff';
  ctx.shadowColor = 'rgba(0,0,0,.2)'; ctx.shadowBlur = 10;
  ctx.fill();
  ctx.restore();
  ctx.beginPath(); ctx.arc(c, c, hub, 0, TAU);
  ctx.lineWidth = Math.max(3, s * 0.008); ctx.strokeStyle = '#ff5d73'; ctx.stroke();
  ctx.fillStyle = '#ff5d73';
  ctx.font = `${hub * 0.62}px ${titleFont}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(spinning ? '두근' : '뽑기', c, c + 1);

  // 위쪽 고정 화살표
  const pw = s * 0.04, ph = s * 0.085;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(c - pw, 2);
  ctx.lineTo(c + pw, 2);
  ctx.lineTo(c, ph);
  ctx.closePath();
  ctx.fillStyle = '#ff5d73';
  ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
  ctx.fill();
  ctx.restore();
  ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(c - pw, 2); ctx.lineTo(c + pw, 2); ctx.lineTo(c, ph); ctx.closePath(); ctx.stroke();
}

// 화면 크기에 맞춰 룰렛 크기 계산
function resizeWheel(){
  const wrap = $('wheelWrap');
  const rect = wrap.getBoundingClientRect();
  let size;
  if (window.innerWidth <= 900){
    size = Math.min(rect.width || 360, 620);
  } else {
    const availH = window.innerHeight - rect.top - 28;
    size = Math.min(rect.width || 500, availH, 900);
  }
  wheelSize = Math.max(260, Math.floor(size));
  canvas.style.width = canvas.style.height = wheelSize + 'px';
  canvas.width = canvas.height = Math.round(wheelSize * dpr);
  drawWheel();
}

// 룰렛에 올릴 이름 다시 정하기
function refreshWheel(){
  wheelNames = $('excludeChk').checked ? getCandidates() : names.slice();
  drawWheel();
  const st = $('pickStatus');
  if (names.length === 0) st.textContent = '왼쪽에 명단을 입력해 주세요.';
  else if (wheelNames.length === 0) st.textContent = '모두 뽑혔어요! [기록 초기화]를 눌러 주세요.';
  else st.textContent = `룰렛에 ${wheelNames.length}명이 있어요.`;
  $('spinBtn').disabled = spinning || wheelNames.length === 0;
}

// 화살표가 가리키는 칸 번호
function indexAtPointer(){
  const n = wheelNames.length;
  if (!n) return -1;
  const a = (((1.5 * Math.PI - rotation) % TAU) + TAU) % TAU;
  return Math.floor(a / (TAU / n)) % n;
}

/* =========================================================
   효과음 (Web Audio로 직접 만들어 파일 없이 동작)
   ========================================================= */
function ensureAudio(){
  if (!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, start, dur, vol, type){
  if (!audioCtx || !$('soundChk').checked) return;
  const t = audioCtx.currentTime + start;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type || 'triangle';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
const tick = () => beep(1100, 0, 0.04, 0.06, 'square');
function fanfare(){
  [523, 659, 784, 1047].forEach((f, i) => beep(f, i * 0.12, 0.35, 0.12));
  beep(1319, 0.5, 0.6, 0.1);
}

/* =========================================================
   룰렛 돌리기
   ========================================================= */
// 처음엔 빠르고 끝으로 갈수록 부드럽게 느려지는 곡선
const easeOut = (t) => 1 - Math.pow(1 - t, 4);

function spin(){
  if (spinning) return;
  refreshWheel();
  const n = wheelNames.length;
  if (n === 0){ toast(names.length ? '모두 뽑혔어요. 기록을 초기화해 주세요.' : '먼저 명단을 입력해 주세요.'); return; }
  ensureAudio();

  // 당첨자를 먼저 공정하게 정하고, 그 칸에서 멈추도록 회전량 계산
  const winIdx = randInt(n);
  const seg = TAU / n;
  const jitter = (Math.random() - 0.5) * seg * 0.7;           // 칸 안에서 멈추는 위치를 살짝 다르게
  const target = 1.5 * Math.PI - (winIdx + 0.5) * seg - jitter; // 화살표(위쪽)에 맞출 각도
  const startRot = rotation;
  const extraTurns = 6 + randInt(3);                            // 6~8바퀴 추가 회전
  const delta = (((target - startRot) % TAU) + TAU) % TAU + extraTurns * TAU;
  const duration = 5500 + Math.random() * 1500;

  spinning = true;
  $('spinBtn').disabled = true;
  $('pickStatus').textContent = '두구두구두구…';
  let lastIdx = indexAtPointer();
  const t0 = performance.now();

  function frame(now){
    const t = Math.min(1, (now - t0) / duration);
    rotation = startRot + delta * easeOut(t);
    drawWheel();
    const idx = indexAtPointer();
    if (idx !== lastIdx){ lastIdx = idx; tick(); } // 칸을 넘을 때마다 '틱' 소리
    if (t < 1) requestAnimationFrame(frame);
    else finishSpin(wheelNames[winIdx]);
  }
  requestAnimationFrame(frame);
}

function finishSpin(winner){
  rotation %= TAU;
  spinning = false;
  drawWheel();
  drawn.push(winner);
  renderHistory();
  $('winnerName').textContent = winner;
  $('winnerOverlay').classList.add('show');
  $('pickStatus').textContent = `🎉 ${winner} 님이 뽑혔어요!`;
  fanfare();
  launchConfetti();
}

function closeWinner(){
  $('winnerOverlay').classList.remove('show');
  refreshWheel();
}

function renderHistory(){
  const ol = $('historyList');
  ol.innerHTML = '';
  if (drawn.length === 0){
    const li = document.createElement('li');
    li.className = 'empty'; li.style.border = 'none'; li.style.background = 'none';
    li.textContent = '아직 없어요';
    ol.appendChild(li);
    return;
  }
  drawn.forEach((name, i) => {
    const li = document.createElement('li');
    const b = document.createElement('b');
    b.textContent = (i + 1) + '.';
    li.append(b, document.createTextNode(name));
    ol.appendChild(li);
  });
}

/* =========================================================
   꽃가루 효과
   ========================================================= */
const cCanvas = $('confetti');
const cCtx = cCanvas.getContext('2d');
const CONFETTI_COLORS = ['#FF6B6B','#FFD43B','#4DABF7','#69DB7C','#B197FC','#FFA94D','#F783AC','#38D9A9'];
let particles = [];
let confettiRunning = false;

function makeParticle(x, y, vx, vy){
  return {
    x, y, vx, vy,
    w: 7 + Math.random() * 7, h: 10 + Math.random() * 10,
    color: CONFETTI_COLORS[randInt(CONFETTI_COLORS.length)],
    rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 0.3,
    wobble: Math.random() * TAU,
    circle: Math.random() < 0.25
  };
}

function launchConfetti(){
  const W = window.innerWidth, H = window.innerHeight;
  cCanvas.width = W * dpr; cCanvas.height = H * dpr;
  cCanvas.style.width = W + 'px'; cCanvas.style.height = H + 'px';
  // 위에서 흩날리는 꽃가루
  for (let i = 0; i < 150; i++){
    particles.push(makeParticle(Math.random() * W, -20 - Math.random() * H * 0.6, (Math.random() - 0.5) * 3, 2 + Math.random() * 3));
  }
  // 양쪽 아래 모서리에서 터지는 꽃가루
  for (let i = 0; i < 70; i++){
    particles.push(makeParticle(0, H, 6 + Math.random() * 10, -(13 + Math.random() * 9)));
    particles.push(makeParticle(W, H, -(6 + Math.random() * 10), -(13 + Math.random() * 9)));
  }
  if (!confettiRunning){ confettiRunning = true; requestAnimationFrame(confettiLoop); }
}

function confettiLoop(){
  const W = window.innerWidth, H = window.innerHeight;
  cCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cCtx.clearRect(0, 0, W, H);
  for (const p of particles){
    p.vy += 0.22;          // 중력
    p.vx *= 0.985;         // 공기 저항
    p.vy *= 0.985;
    p.wobble += 0.1;
    p.x += p.vx + Math.sin(p.wobble) * 0.8;
    p.y += p.vy;
    p.rot += p.vr;
    cCtx.save();
    cCtx.translate(p.x, p.y);
    cCtx.rotate(p.rot);
    cCtx.fillStyle = p.color;
    if (p.circle){
      cCtx.beginPath(); cCtx.arc(0, 0, p.w / 2, 0, TAU); cCtx.fill();
    } else {
      // 뒤집히는 느낌을 주기 위해 세로 크기를 출렁이게
      cCtx.fillRect(-p.w / 2, -p.h / 2 * Math.abs(Math.cos(p.wobble)), p.w, p.h * Math.abs(Math.cos(p.wobble)));
    }
    cCtx.restore();
  }
  particles = particles.filter(p => p.y < H + 40 && p.x > -60 && p.x < W + 60);
  if (particles.length) requestAnimationFrame(confettiLoop);
  else { confettiRunning = false; cCtx.clearRect(0, 0, W, H); }
}

/* =========================================================
   조 편성
   ========================================================= */
const getMode = () => document.querySelector('input[name="teamMode"]:checked').value;

function updateTeamUnit(){
  $('teamUnit').textContent = getMode() === 'count' ? '개 조' : '명씩';
}

function makeTeams(){
  const total = names.length;
  if (total < 2){ toast('조를 나누려면 2명 이상 필요해요.'); return; }
  let n = parseInt($('teamN').value, 10);
  if (!n || n < 1){ n = 1; $('teamN').value = 1; }

  // 조 개수 정하기
  let g;
  if (getMode() === 'count'){
    g = n;
    if (g > total){ g = total; toast(`인원보다 조가 많아서 ${total}개 조로 나눴어요.`); }
  } else {
    g = Math.floor(total / n);
    if (g < 1){ g = 1; toast('인원이 적어서 1개 조로 묶었어요.'); }
  }

  // 무작위로 섞은 뒤, 남는 인원은 앞 조부터 한 명씩 더 배치
  const list = shuffle(names.slice());
  const base = Math.floor(total / g);
  const rem = total % g;
  groups = [];
  let k = 0;
  for (let i = 0; i < g; i++){
    const size = base + (i < rem ? 1 : 0);
    groups.push(list.slice(k, k + size));
    k += size;
  }
  renderTeams();
}

function renderTeams(){
  const grid = $('teamGrid');
  grid.innerHTML = '';
  $('teamEmpty').style.display = groups ? 'none' : 'block';
  $('reshuffleBtn').disabled = !groups;
  $('copyBtn').disabled = !groups;
  if (!groups){ $('teamSummary').textContent = ''; return; }

  const total = groups.reduce((s, t) => s + t.length, 0);
  $('teamSummary').textContent = `총 ${total}명 · ${groups.length}개 조`;

  groups.forEach((members, i) => {
    const card = document.createElement('article');
    card.className = 'team-card';
    card.style.setProperty('--c', COLORS[i % COLORS.length]);
    card.style.animationDelay = (i * 0.07) + 's';

    const head = document.createElement('header');
    const title = document.createElement('strong');
    title.textContent = (i + 1) + '조';
    const cnt = document.createElement('span');
    cnt.textContent = members.length + '명';
    head.append(title, cnt);
    // 노란색처럼 밝은 머리띠에는 진한 글씨
    if (textColorFor(COLORS[i % COLORS.length]) !== '#ffffff') head.style.color = '#2b2d42';

    const ul = document.createElement('ul');
    members.forEach(m => {
      const li = document.createElement('li');
      li.textContent = m;
      ul.appendChild(li);
    });
    card.append(head, ul);
    grid.appendChild(card);
  });
}

// 메신저에 붙여넣기 좋은 글 형태로 만들기
function teamsToText(){
  const total = groups.reduce((s, t) => s + t.length, 0);
  let txt = `📋 조 편성 결과 (총 ${total}명, ${groups.length}개 조)\n`;
  groups.forEach((m, i) => { txt += `\n[${i + 1}조] ${m.length}명\n${m.join(', ')}\n`; });
  return txt.trim();
}

async function copyTeams(){
  if (!groups) return;
  const text = teamsToText();
  try {
    await navigator.clipboard.writeText(text);
    toast('복사했어요! 메신저에 붙여넣으세요.');
  } catch (e){
    // 클립보드 기능을 못 쓰는 환경을 위한 예비 방법
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    toast(ok ? '복사했어요! 메신저에 붙여넣으세요.' : '복사에 실패했어요. 직접 선택해 복사해 주세요.');
  }
}

/* =========================================================
   화면 설정: 글씨 크기, 전체 화면, 명단 접기, 탭
   ========================================================= */
let rootFont = parseInt(load(FONT_KEY), 10) || 18;
function applyFont(){
  rootFont = Math.min(30, Math.max(14, rootFont));
  document.documentElement.style.fontSize = rootFont + 'px';
  save(FONT_KEY, rootFont);
  requestAnimationFrame(resizeWheel);
}

function toggleFullscreen(){
  const el = document.documentElement;
  const isFs = document.fullscreenElement || document.webkitFullscreenElement;
  if (!isFs){
    (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  }
}
function onFullscreenChange(){
  const isFs = document.fullscreenElement || document.webkitFullscreenElement;
  $('fullscreenBtn').textContent = isFs ? '⤢ 전체 화면 끄기' : '⛶ 전체 화면';
  setTimeout(resizeWheel, 100);
}

function switchTab(id){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === id));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === id));
  if (id === 'pickView') requestAnimationFrame(resizeWheel);
}

/* =========================================================
   이벤트 연결
   ========================================================= */
nameInput.addEventListener('input', onNamesChanged);
$('sampleBtn').addEventListener('click', () => { nameInput.value = SAMPLE_NAMES.join('\n'); onNamesChanged(); });
$('clearBtn').addEventListener('click', () => {
  if (names.length && !confirm('명단을 모두 지울까요?')) return;
  nameInput.value = ''; onNamesChanged(); nameInput.focus();
});

$('spinBtn').addEventListener('click', spin);
canvas.addEventListener('click', spin);
$('excludeChk').addEventListener('change', () => { if (!spinning) refreshWheel(); });
$('resetHistoryBtn').addEventListener('click', () => {
  if (spinning) return;
  drawn = []; renderHistory(); refreshWheel(); toast('뽑힌 기록을 초기화했어요.');
});
$('winnerOkBtn').addEventListener('click', closeWinner);
$('winnerAgainBtn').addEventListener('click', () => { closeWinner(); setTimeout(spin, 250); });
$('winnerOverlay').addEventListener('click', (e) => { if (e.target.id === 'winnerOverlay') closeWinner(); });

document.querySelectorAll('input[name="teamMode"]').forEach(r => r.addEventListener('change', updateTeamUnit));
$('nMinus').addEventListener('click', () => { $('teamN').value = Math.max(1, (parseInt($('teamN').value, 10) || 1) - 1); });
$('nPlus').addEventListener('click', () => { $('teamN').value = (parseInt($('teamN').value, 10) || 0) + 1; });
$('makeTeamBtn').addEventListener('click', makeTeams);
$('reshuffleBtn').addEventListener('click', makeTeams);
$('copyBtn').addEventListener('click', copyTeams);

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));
$('fontUpBtn').addEventListener('click', () => { rootFont += 2; applyFont(); });
$('fontDownBtn').addEventListener('click', () => { rootFont -= 2; applyFont(); });
$('fullscreenBtn').addEventListener('click', toggleFullscreen);
document.addEventListener('fullscreenchange', onFullscreenChange);
document.addEventListener('webkitfullscreenchange', onFullscreenChange);
$('toggleListBtn').addEventListener('click', () => {
  const hidden = $('layout').classList.toggle('hide-list');
  $('toggleListBtn').textContent = hidden ? '📋 명단 펼치기' : '📋 명단 접기';
  requestAnimationFrame(resizeWheel);
});

// 키보드: 스페이스/엔터로 뽑기, 발표 창 닫기
document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'textarea' || tag === 'input') return;
  const overlayOpen = $('winnerOverlay').classList.contains('show');
  if (overlayOpen && ['Enter', 'Escape', ' '].includes(e.key)){
    e.preventDefault(); closeWinner(); return;
  }
  if (!overlayOpen && $('pickView').classList.contains('active') && (e.key === ' ' || e.key === 'Enter')){
    e.preventDefault(); spin();
  }
});

let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resizeWheel, 80); });

/* =========================================================
   시작
   ========================================================= */
const savedNames = load(STORAGE_KEY);
nameInput.value = (savedNames !== null && savedNames.trim() !== '') ? savedNames : SAMPLE_NAMES.join('\n');
document.documentElement.style.fontSize = rootFont + 'px';
onNamesChanged();
renderHistory();
renderTeams();
updateTeamUnit();
resizeWheel();
// 제목 글꼴이 늦게 내려받아지면 룰렛을 다시 그림
if (document.fonts && document.fonts.load){
  document.fonts.load(`20px Jua`).then(resizeWheel).catch(() => {});
}
</script>
