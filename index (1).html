<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>업무 도구 모음</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --bg: #f4f5f2;
      --surface: #ffffff;
      --border: #e2e4de;
      --text: #2b2f2c;
      --text-sub: #6b716c;
      --accent: #3f6b5a;
      --accent-soft: #e8efe9;
      --fun: #b07a3c;      --fun-soft: #f6eee2;
      --news: #3c6488;     --news-soft: #e6eef5;
      --work: #3f6b5a;     --work-soft: #e8efe9;
      --shadow: 0 1px 2px rgba(30, 40, 35, .04), 0 4px 16px rgba(30, 40, 35, .05);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1f1d;
        --surface: #242826;
        --border: #343936;
        --text: #e4e7e3;
        --text-sub: #9aa29c;
        --accent: #8fbfa8;
        --fun: #d9a86c;  --fun-soft: #3a3226;
        --news: #8db4d6; --news-soft: #26313b;
        --work: #8fbfa8; --work-soft: #263530;
        --shadow: 0 1px 2px rgba(0,0,0,.2), 0 4px 16px rgba(0,0,0,.2);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 960px; margin: 0 auto; padding: 64px 24px 48px; }

    header { margin-bottom: 48px; }
    .eyebrow {
      font-size: 13px; font-weight: 600; letter-spacing: .08em;
      color: var(--accent); text-transform: uppercase; margin-bottom: 10px;
    }
    h1 { font-size: 32px; font-weight: 700; letter-spacing: -.02em; }
    .desc { margin-top: 8px; color: var(--text-sub); font-size: 15px; }
    .today { margin-top: 20px; font-size: 14px; color: var(--text-sub); }

    section { margin-bottom: 40px; }
    .section-head {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 14px; padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .section-head .dot { width: 8px; height: 8px; border-radius: 50%; }
    .section-head h2 { font-size: 17px; font-weight: 600; }
    .section-head .count { font-size: 13px; color: var(--text-sub); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }

    .card {
      display: flex; align-items: center; gap: 16px;
      padding: 20px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 14px;
      text-decoration: none; color: inherit;
      box-shadow: var(--shadow);
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-2px);
      border-color: var(--c);
      box-shadow: 0 2px 4px rgba(30,40,35,.05), 0 10px 28px rgba(30,40,35,.09);
      outline: none;
    }
    .icon {
      flex-shrink: 0; width: 48px; height: 48px; border-radius: 12px;
      display: grid; place-items: center;
      background: var(--c-soft); color: var(--c);
    }
    .icon svg { width: 24px; height: 24px; }
    .card-body { flex: 1; min-width: 0; }
    .card-title { font-size: 16px; font-weight: 600; }
    .card-desc { font-size: 13.5px; color: var(--text-sub); margin-top: 2px; }
    .arrow { color: var(--text-sub); flex-shrink: 0; transition: transform .18s ease, color .18s ease; }
    .card:hover .arrow { transform: translateX(3px); color: var(--c); }

    .fun  { --c: var(--fun);  --c-soft: var(--fun-soft); }
    .news { --c: var(--news); --c-soft: var(--news-soft); }
    .work { --c: var(--work); --c-soft: var(--work-soft); }

    footer {
      margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--border);
      font-size: 13px; color: var(--text-sub); text-align: center;
    }
    @media (max-width: 600px) {
      .wrap { padding: 40px 16px 32px; }
      h1 { font-size: 26px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">Toolbox</div>
      <h1>업무 도구 모음</h1>
      <p class="desc">자주 쓰는 도구를 한곳에 모았습니다. 원하는 항목을 선택하세요.</p>
      <p class="today" id="today"></p>
    </header>

    <!-- 재미 -->
    <section class="fun">
      <div class="section-head">
        <span class="dot" style="background:var(--fun)"></span>
        <h2>재미</h2><span class="count">3</span>
      </div>
      <div class="grid">
        <a class="card fun" href="사다리타기.html">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 3v18M12 3v18M18 3v18M6 7h6M12 12h6M6 16h6"/></svg>
          </div>
          <div class="card-body">
            <div class="card-title">사다리타기</div>
            <div class="card-desc">공정하게 순서와 당첨자 정하기</div>
          </div>
          <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
        </a>

        <a class="card fun" href="룰렛추첨기.html">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6.4 6.4M12 12l-6.4 6.4M12 12H3"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
          </div>
          <div class="card-body">
            <div class="card-title">룰렛 추첨기</div>
            <div class="card-desc">돌려서 무작위로 뽑기</div>
          </div>
          <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
        </a>

        <a class="card fun" href="https://script.google.com/macros/s/AKfycbweqKdk0ypIn6-AJ1TXqkrMF2RWOfyvFGpgalCS28q-6yY-hDjbe46QLqyBIvmiqU5b2A/exec" target="_blank" rel="noopener">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15a4 4 0 0 1 .5-8 5 5 0 0 1 9.6 1.5A3.5 3.5 0 0 1 17 15"/><path d="M5 19h14M8 15c0 2.2 1.8 4 4 4s4-1.8 4-4H8z"/></svg>
          </div>
          <div class="card-body">
            <div class="card-title">날씨 기반 점심 고르기</div>
            <div class="card-desc">오늘 날씨에 맞는 메뉴 추천</div>
          </div>
          <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>
        </a>
      </div>
    </section>

    <!-- 뉴스 -->
    <section>
      <div class="section-head">
        <span class="dot" style="background:var(--news)"></span>
        <h2>뉴스</h2><span class="count">1</span>
      </div>
      <div class="grid">
        <a class="card news" href="https://script.google.com/macros/s/AKfycbwN1QNyqIY1Q8Q96jXzGOm-Hx3z2wYtFYcU6E_9HQZ89ivae1qXq0yAYakgU6sfMBZ9/exec" target="_blank" rel="noopener">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h4M7 16h4M14 12h3v4h-3z"/></svg>
          </div>
          <div class="card-body">
            <div class="card-title">한전 뉴스 대시보드</div>
            <div class="card-desc">한국전력 관련 최신 뉴스 모아보기</div>
          </div>
          <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>
        </a>
      </div>
    </section>

    <!-- 업무 -->
    <section>
      <div class="section-head">
        <span class="dot" style="background:var(--work)"></span>
        <h2>업무</h2><span class="count">1</span>
      </div>
      <div class="grid">
        <a class="card work" href="PDF병합도구.html">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h6l4 4v10a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M14 3v4h4"/><path d="M4 7v12a2 2 0 0 0 2 2h9"/><path d="M10 11v5M7.5 13.5h5"/></svg>
          </div>
          <div class="card-body">
            <div class="card-title">PDF 병합</div>
            <div class="card-desc">여러 PDF 파일을 하나로 합치기</div>
          </div>
          <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
        </a>
      </div>
    </section>

    <footer>↗ 표시가 있는 항목은 새 탭에서 열립니다.</footer>
  </div>

  <script>
    const d = new Date();
    const days = ['일', '월', '화', '수', '목', '금', '토'];
    document.getElementById('today').textContent =
      `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
  </script>
</body>
</html>
